name: LabelBox URL validation

on:
  push:
    branches: [validation/20261116-labelbox-url-encoding]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            unstructured
            test_unstructured
            example-docs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public API dependencies
        run: >-
          python -m pip install -e '.[chunking-tokens,docx]'
          'pytest>=9,<10' pytest-mock 'ruff>=0.15,<1' 'pandas>=2,<3'
      - name: Check changed-file style
        run: |
          ruff check unstructured/staging/label_box.py test_unstructured/staging/test_label_box_urls.py
          ruff format --check unstructured/staging/label_box.py test_unstructured/staging/test_label_box_urls.py
      - name: Fetch the pinned original production source
        run: git fetch --depth=1 origin ac932052e6e0ba3feab8a6e96b6d4480218e009f
      - name: Reproduce the same regression cases against the original source
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          files = ["unstructured/staging/label_box.py"]
          saved = {name: Path(name).read_bytes() for name in files}
          try:
              for name in files:
                  Path(name).write_bytes(subprocess.check_output(["git", "show", f"ac932052e6e0ba3feab8a6e96b6d4480218e009f:{name}"]))
              result = subprocess.run([sys.executable, "-m", "pytest", "-q",
                  "test_unstructured/staging/test_label_box_urls.py",
                  "--junitxml=baseline.xml"])
              report = ET.parse("baseline.xml").getroot()
              assert result.returncode == 1, result.returncode
              assert len(report.findall(".//failure")) == 12
              assert len(report.findall(".//testcase")) == 14
              assert not report.findall(".//error")
          finally:
              for name, content in saved.items():
                  Path(name).write_bytes(content)
      - name: Run regression cases and neighboring public API suites
        run: >-
          python -m pytest -q
          test_unstructured/staging/test_label_box_urls.py
          test_unstructured/staging/test_label_box.py
          --junitxml=results.xml
      - name: Record source and dependency identities
        if: always()
        run: |
          git rev-parse HEAD
          git diff --exit-code
          python --version
          python -m pip freeze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: labelbox-url-results
          path: |
            baseline.xml
            results.xml
