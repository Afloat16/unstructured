name: Per-element language work validation

on:
  push:
    branches: [validation/20261116-per-element-language-work]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            unstructured
            test_unstructured
            example-docs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public API dependencies
        run: >-
          python -m pip install -e '.[chunking-tokens,docx]'
          'pytest>=9,<10' pytest-mock 'ruff>=0.15,<1' 'pandas>=2,<3'
      - name: Check changed-file style
        run: |
          ruff check unstructured/partition/common/lang.py test_unstructured/partition/common/test_per_element_language_work.py
          ruff format --check unstructured/partition/common/lang.py test_unstructured/partition/common/test_per_element_language_work.py
      - name: Fetch the pinned original production source
        run: git fetch --depth=1 origin ac932052e6e0ba3feab8a6e96b6d4480218e009f
      - name: Reproduce the same regression cases against the original source
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          files = ["unstructured/partition/common/lang.py"]
          saved = {name: Path(name).read_bytes() for name in files}
          try:
              for name in files:
                  Path(name).write_bytes(subprocess.check_output(["git", "show", f"ac932052e6e0ba3feab8a6e96b6d4480218e009f:{name}"]))
              result = subprocess.run([sys.executable, "-m", "pytest", "-q",
                  "test_unstructured/partition/common/test_per_element_language_work.py",
                  "--junitxml=baseline.xml"])
              report = ET.parse("baseline.xml").getroot()
              assert result.returncode == 1, result.returncode
              assert len(report.findall(".//failure")) == 10
              assert len(report.findall(".//testcase")) == 13
              assert not report.findall(".//error")
              subprocess.run([sys.executable, "validate_language_work.py", "before-language.json"], check=True)
          finally:
              for name, content in saved.items():
                  Path(name).write_bytes(content)
      - name: Run regression cases and neighboring public API suites
        run: >-
          python -m pytest -q
          test_unstructured/partition/common/test_per_element_language_work.py
          test_unstructured/partition/common/test_lang.py
          test_unstructured/partition/common/test_empty_language_selection.py
          test_unstructured/partition/test_text.py
          --junitxml=results.xml
      - name: Measure the final source and verify identical language output
        run: |
          python validate_language_work.py after-language.json
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path("before-language.json").read_text())
          after = json.loads(Path("after-language.json").read_text())
          assert before["output_sha256"] == after["output_sha256"]
          print("BEFORE", before)
          print("AFTER", after)
          print("TIME_RATIO", after["median_seconds"] / before["median_seconds"])
          print("PEAK_RATIO", after["tracemalloc_peak_bytes"] / before["tracemalloc_peak_bytes"])
          PY
      - name: Record source and dependency identities
        if: always()
        run: |
          git rev-parse HEAD
          git diff --exit-code
          python --version
          python -m pip freeze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: per-element-language-results
          path: |
            baseline.xml
            results.xml
            before-language.json
            after-language.json
