name: Table header span validation

on:
  push:
    branches: [validation/table-header-spans-20261116]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DO_NOT_TRACK: "1"
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            unstructured
            test_unstructured/metrics
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU model imports and the real table renderer
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.10.0+cpu" "torchvision==0.25.0+cpu"
          python -m pip install "unstructured-inference==1.6.12" "pytest>=9,<10" "ruff>=0.15,<1" beautifulsoup4 requests typing-extensions
      - name: Verify renderer provenance
        shell: python
        run: |
          import importlib.metadata
          import inspect
          from unstructured_inference.models.tables import cells_to_html
          print("unstructured-inference", importlib.metadata.version("unstructured-inference"))
          print("renderer", inspect.getsourcefile(cells_to_html))
          assert importlib.metadata.version("unstructured-inference") == "1.6.12"
      - name: Fetch reviewed production source
        run: git fetch --depth=1 origin 85291513bb5dfbfcf72c8f8bd68cd4b564530745 ad56303cfae517612afcd5db85d3b4e303aa0d03
      - name: Compare sparse-case HTML with the original base
        shell: python
        run: |
          import subprocess
          from unstructured.metrics.table.table_extraction import deckerd_table_to_html

          cells = [
              {"x": 0, "y": 0, "w": 4, "h": 2, "content": "r0c0"},
              {"x": 4, "y": 0, "w": 1, "h": 1, "content": "r0c4"},
              {"x": 4, "y": 1, "w": 1, "h": 3, "content": "r1c4"},
          ]
          covered = {
              (x, y) for cell in cells
              for x in range(cell["x"], cell["x"] + cell["w"])
              for y in range(cell["y"], cell["y"] + cell["h"])
          }
          cells.extend(
              {"x": x, "y": y, "w": 1, "h": 1, "content": f"r{y}c{x}"}
              for y in range(5) for x in range(5)
              if (x, y) not in covered and (x, y) != (0, 3)
          )
          original = subprocess.check_output([
              "git", "show",
              "ad56303cfae517612afcd5db85d3b4e303aa0d03:unstructured/metrics/table/table_extraction.py",
          ])
          namespace = {"__name__": "original_table_extraction"}
          exec(compile(original, "<original_table_extraction>", "exec"), namespace)
          baseline_html = namespace["deckerd_table_to_html"](cells)
          assert baseline_html == deckerd_table_to_html(cells)
          baseline_cells = {
              cell["content"]: cell
              for cell in namespace["html_table_to_deckerd"](baseline_html) if cell["content"]
          }
          assert baseline_cells["r2c0"]["x"] == 1
          assert baseline_cells["r2c0"]["y"] == 2
          print("Original base and candidate emit identical sparse-case HTML.")
          print("The original importer already maps r2c0 to x=1, y=2.")
      - name: Reproduce the staggered and chained header regressions
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          source = pathlib.Path("unstructured/metrics/table/table_extraction.py")
          revised = source.read_bytes()
          try:
              source.write_bytes(subprocess.check_output([
                  "git", "show",
                  "85291513bb5dfbfcf72c8f8bd68cd4b564530745:unstructured/metrics/table/table_extraction.py",
              ]))
              result = subprocess.run([
                  sys.executable, "-m", "pytest", "-q",
                  "test_unstructured/metrics/test_table_export_header_spans.py",
                  "--junitxml=reviewed.xml",
              ])
              report = ET.parse("reviewed.xml").getroot()
              assert result.returncode == 1
              assert len(report.findall(".//failure")) == 4
              assert len(report.findall(".//testcase")) == 12
              assert not report.findall(".//error")
          finally:
              source.write_bytes(revised)
      - name: Verify real HTML serialization and reimport
        run: >-
          python -m pytest -q
          test_unstructured/metrics/test_table_export_header_spans.py
          test_unstructured/metrics/test_table_formats.py
          test_unstructured/metrics/test_table_alignment.py
          --junitxml=revised.xml
      - name: Check style and source integrity
        run: |
          ruff check unstructured/metrics/table/table_extraction.py test_unstructured/metrics/test_table_export_header_spans.py
          ruff format --check unstructured/metrics/table/table_extraction.py test_unstructured/metrics/test_table_export_header_spans.py
          git diff --exit-code
          git diff --check
          python --version
          python -m pip freeze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-header-span-results
          path: |
            reviewed.xml
            revised.xml
