name: Document fidelity validation

on:
  push:
    branches: [validation/20261116-document-fidelity]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            unstructured
            test_unstructured
            example-docs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public API dependencies
        run: >-
          python -m pip install -e '.[chunking-tokens]'
          'pytest>=9,<10' pytest-mock 'ruff>=0.15,<1' 'pandas>=2,<3'
      - name: Check changed-file style
        run: |
          ruff check unstructured/documents/elements.py unstructured/chunking/dispatch.py unstructured/partition/html/convert.py test_unstructured/documents/test_embedding_export_ownership.py test_unstructured/chunking/test_reconstructed_table_identity.py test_unstructured/partition/html/test_code_snippet_export.py test_unstructured/partition/html/test_unpaged_export.py
          ruff format --check unstructured/documents/elements.py unstructured/chunking/dispatch.py unstructured/partition/html/convert.py test_unstructured/documents/test_embedding_export_ownership.py test_unstructured/chunking/test_reconstructed_table_identity.py test_unstructured/partition/html/test_code_snippet_export.py test_unstructured/partition/html/test_unpaged_export.py
      - name: Run regression cases and neighboring public API suites
        run: >-
          python -m pytest -q
          test_unstructured/documents/test_embedding_export_ownership.py
          test_unstructured/chunking/test_reconstructed_table_identity.py
          test_unstructured/partition/html/test_code_snippet_export.py
          test_unstructured/partition/html/test_unpaged_export.py
          test_unstructured/documents/test_elements.py
          test_unstructured/chunking/test_base.py
          test_unstructured/chunking/test_dispatch.py
          test_unstructured/partition/html/test_convert.py
          --junitxml=results.xml
      - name: Record source and dependency identities
        if: always()
        run: |
          git rev-parse HEAD
          git diff --exit-code
          python --version
          python -m pip freeze
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-fidelity-results
          path: results.xml
